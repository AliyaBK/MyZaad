<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A355C">
<title>Zaaduna</title>
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Golos+Text:wght@400;500;600&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>/* Платформа переименована, ключи вместе с ней. Старые переносим, чтобы
   читатель не потерял пройденное; "myzaad_" ниже — единственный след прежнего имени. */
try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("myzaad_")!==0)return;
var n="zaaduna_"+k.slice(7);if(localStorage.getItem(n)===null)localStorage.setItem(n,localStorage.getItem(k));
localStorage.removeItem(k);});}catch(e){}</script>
<script>/* Тема ставится до первой отрисовки, иначе страница моргнёт чужим цветом.
   Без сохранённого выбора тему задаёт система. */
try{var t=localStorage.getItem("zaaduna_theme");
if(t==="day"||t==="night"){t=(t==="day")?"light":"dark";localStorage.setItem("zaaduna_theme",t);}
if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sheet">
  <header class="isnad">
    <a class="brand-mark" href="index.html" aria-label="Оглавление">
      <picture>
        <source srcset="assets/logo-mark-dark.png" media="(prefers-color-scheme: dark)">
        <img id="brandLogo" src="assets/logo-mark.png" width="138" height="120" alt="" decoding="async">
      </picture>
      <span class="brand-mark-label">Оглавление</span>
    </a>
    <p class="chain" id="chain"></p>
    <p class="runhead" id="runhead"></p>
    <p class="folio"><span id="stepLabel">01</span><span class="folio-rule"></span><span id="stepTotal">14</span></p>
    <button class="theme-switch" id="themeSwitch" type="button" role="switch" aria-checked="false">
      <span class="ts-side ts-sun" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 .9v1.7M8 13.4V15.1M15.1 8h-1.7M2.6 8H.9M13.02 2.98l-1.2 1.2M4.18 11.82l-1.2 1.2M13.02 13.02l-1.2-1.2M4.18 4.18l-1.2-1.2"/></svg></span>
      <span class="ts-track" aria-hidden="true"><span class="ts-knob"><span class="ts-k ts-k-sun"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 .9v1.7M8 13.4V15.1M15.1 8h-1.7M2.6 8H.9M13.02 2.98l-1.2 1.2M4.18 11.82l-1.2 1.2M13.02 13.02l-1.2-1.2M4.18 4.18l-1.2-1.2"/></svg></span><span class="ts-k ts-k-moon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.6 9.9A6 6 0 0 1 6.1 2.4 6 6 0 1 0 13.6 9.9Z"/></svg></span></span></span>
      <span class="ts-side ts-moon" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.6 9.9A6 6 0 0 1 6.1 2.4 6 6 0 1 0 13.6 9.9Z"/></svg></span>
    </button>
  </header>
  <div class="gauge"><span class="gauge-fill" id="progressFill"></span></div>

  <main id="app"></main>
</div>

<div class="colophon">
  <div class="colophon-inner">
    <button class="act act-back" id="backBtn">Назад</button>
    <button class="act act-go" id="nextBtn">Начать</button>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function(){
  // Какую главу открыть — через ?ch=2 (по умолчанию глава 1).
  // Чтобы добавить главу, движок и эту оболочку менять не нужно —
  // достаточно создать файл chapterN-data.js рядом с этим файлом.
  var params = new URLSearchParams(window.location.search);
  var chapterId = params.get("ch") || "1";
  var script = document.createElement("script");
  script.src = "chapter" + chapterId + "-data.js";
  script.onload = function(){
    if(window.CHAPTER_DATA){
      window.ZaadunaEngine.init(window.CHAPTER_DATA);
    } else {
      document.getElementById("app").innerHTML = "<p class=\"lede\">Файл главы " + chapterId + " не задаёт CHAPTER_DATA.</p>";
    }
  };
  script.onerror = function(){
    document.getElementById("app").innerHTML = "<p class=\"lede\">Не удалось загрузить главу " + chapterId + " (chapter" + chapterId + "-data.js).</p>";
  };
  document.body.appendChild(script);
})();
</script>
<script src="theme.js"></script>
</body>
</html>
