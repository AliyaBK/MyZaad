<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A355C">
<title>Zaaduna — конспект</title>
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Golos+Text:wght@400;500;600&family=Amiri:ital@0;1&display=swap" rel="stylesheet">
<script>/* Платформа переименована, ключи вместе с ней. Старые переносим, чтобы
   читатель не потерял пройденное; "myzaad_" ниже — единственный след прежнего имени. */
try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("myzaad_")!==0)return;
var n="zaaduna_"+k.slice(7);if(localStorage.getItem(n)===null)localStorage.setItem(n,localStorage.getItem(k));
localStorage.removeItem(k);});}catch(e){}</script>
<link rel="stylesheet" href="konspekt.css">
</head>
<body>

<div class="k-bar">
  <nav class="k-nav">
    <a class="k-back" href="index.html">Оглавление</a>
    <a class="k-back" id="kToChapter" href="chapter.html?ch=1">К главе</a>
  </nav>
  <label class="k-opt"><input type="checkbox" id="kGuideOn"> Печатать «Как проходить главу»</label>
  <button class="k-print" id="kPrint">Сохранить в PDF</button>
</div>
<p class="k-print-hint" id="kPrintHint" hidden></p>

<article class="k-sheet">
  <header class="k-head">
    <h1 id="kTitle"></h1>
    <p class="k-teacher" id="kTeacher"></p>
    <dl class="k-meta">
      <div><dt>Дата</dt><dd id="kDate"></dd></div>
      <div><dt>Результат</dt><dd id="kScore"></dd></div>
    </dl>
    <p class="k-lede" id="kLede"></p>
  </header>

  <section id="kBody"></section>

  <section id="kGuideWrap" hidden>
    <h2 class="k-rule"><span>Как проходить главу</span></h2>
    <div id="kGuide"></div>
  </section>

  <section>
    <h2 class="k-rule"><span>Разбор вопросов</span></h2>
    <div id="kQuestions"></div>
  </section>

  <footer class="k-foot">
    <p id="kFoot"></p>
    <p class="k-colophon">Zaaduna · конспект главы. Лист собран из материалов главы; проверяйте по источнику.</p>
  </footer>
</article>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var chapterId = params.get("ch") || "1";
  /*
   * Печать и сохранение в PDF.
   *
   * Внутри Телеграма ссылку открывает его собственное окно, и там
   * window.print() молча ничего не делает. Отличить это окно со стороны
   * страницы нельзя: признаки мини-приложения в нём отсутствуют, а по
   * строке браузера оно не представляется. Поэтому печать не угадываем
   * заранее, а смотрим, началась ли она: настоящая печать поднимает
   * событие beforeprint или переключает медиазапрос print. Если за треть
   * секунды не случилось ни того ни другого — печати нет, и тогда мы
   * говорим, что делать, вместо того чтобы молчать.
   */
  var tg = window.Telegram && window.Telegram.WebApp;
  var miniApp = !!(tg && ((tg.initData && tg.initData.length) ||
                          (tg.platform && tg.platform !== "unknown")));
  var kasanie = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  var hint = document.getElementById("kPrintHint");
  var pechatNachalas = false;

  function podskazka(text, vazhno){
    if(!hint) return;
    hint.innerHTML = text;
    hint.hidden = false;
    hint.classList.toggle("k-print-hint-alarm", !!vazhno);
  }

  window.addEventListener("beforeprint", function(){ pechatNachalas = true; });
  if(window.matchMedia){
    var mqPrint = window.matchMedia("print");
    if(mqPrint.addEventListener){
      mqPrint.addEventListener("change", function(e){ if(e.matches) pechatNachalas = true; });
    }
  }

  if(kasanie){
    podskazka("На телефоне лист сохраняется через меню браузера: «Поделиться» → «Напечатать» → «Сохранить в PDF».");
  }

  document.getElementById("kPrint").addEventListener("click", function(){
    // Настоящее мини-приложение умеет вывести страницу во внешний браузер.
    if(miniApp && tg.openLink){ tg.openLink(window.location.href); return; }

    pechatNachalas = false;
    try{ if(typeof window.print === "function") window.print(); }catch(e){}

    setTimeout(function(){
      if(pechatNachalas) return;
      podskazka(
        "<b>Печать здесь недоступна.</b> Похоже, страница открыта во встроенном окне " +
        "другого приложения — чаще всего Телеграма. Откройте её в обычном браузере: " +
        "нажмите «⋮» или «Поделиться» вверху этого окна и выберите «Открыть в Safari» " +
        "или «Открыть в Chrome». Там кнопка «Сохранить в PDF» сработает.",
        true);
    }, 350);
  });

  // Инструкция к приложению печатается только по просьбе; выбор запоминается.
  var box = document.getElementById("kGuideOn");
  function applyGuide(){
    document.body.classList.toggle("guide-on", box.checked);
    try{ localStorage.setItem("zaaduna_konspekt_guide", box.checked ? "1" : "0"); }catch(e){}
  }
  try{ box.checked = localStorage.getItem("zaaduna_konspekt_guide") === "1"; }catch(e){}
  applyGuide();
  box.addEventListener("change", applyGuide);
  document.getElementById("kToChapter").setAttribute("href", "chapter.html?ch=" + chapterId);

  var data = document.createElement("script");
  data.src = "chapter" + chapterId + "-data.js";
  data.onload = function(){
    var r = document.createElement("script");
    r.src = "konspekt.js";
    r.onload = function(){
      if(window.CHAPTER_DATA && window.ZaadunaKonspekt){
        window.ZaadunaKonspekt.build(window.CHAPTER_DATA);
      }
    };
    document.body.appendChild(r);
  };
  data.onerror = function(){
    document.getElementById("kTitle").textContent = "Глава " + chapterId + " не найдена";
  };
  document.body.appendChild(data);
})();
</script>
</body>
</html>
